<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ApplyFlow demo application</title><link rel="stylesheet" href="ui.css"></head><body><main class="profile" style="max-width:720px"><header><div class="brand"><span class="mark">af</span>ApplyFlow</div><span class="pill">Practice application</span></header><h1>Meet your next opportunity.</h1><p>Try autofill here with your saved profile. This practice form has no submit action.</p><div class="toolbar"><button id="test" type="button">Test autofill</button><button id="edit" class="secondary" type="button">Edit profile</button></div><p id="status" class="status" role="status"></p>
<form><section class="card"><h2>About you</h2><div class="grid"><label>First name<input autocomplete="given-name" name="firstName"></label><label>Last name<input autocomplete="family-name" name="lastName"></label><label>Email<input type="email" name="email"></label><label>Phone number<input type="tel" name="phone"></label><label>City<input name="city"></label><label>Country<select name="country"><option value="">Select country</option><option value="US">United States</option><option value="CA">Canada</option><option value="GB">United Kingdom</option></select></label><label>LinkedIn URL<input type="url" name="linkedin"></label><label>Personal website<input type="url" name="website"></label></div></section>
<fieldset class="card"><legend>Experience</legend><div class="grid"><label>Most recent employer<input name="employer"></label><label>Job title<input name="jobTitle"></label></div></fieldset>
<fieldset class="card"><legend>Education</legend><div class="grid"><label>University<input name="school"></label><label>Degree<input name="degree"></label><label>Field of study<input name="major"></label><label>Graduation year<input type="number" name="graduationYear"></label></div></fieldset>
<section class="card"><h2>A little more</h2><label>Professional summary<textarea name="summary"></textarea></label><label style="margin-top:16px">Why are you interested in this role?<textarea name="motivation"></textarea></label><p class="muted">To fill the last question, save an answer with that exact question in your profile.</p></section></form><script src="schema.js"></script><script src="engine.js"></script><script src="content.js"></script><script src="demo.js"></script></main></body></html>
